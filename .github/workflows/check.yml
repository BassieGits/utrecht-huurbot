name: Check huurwoningen

on:
  schedule:
    # Elke 5 minuten (minuut 2, 7, 12, ...; niet op het hele uur, dan is GitHub het drukst).
    # De repo is openbaar, dus Actions-minuten zijn gratis. GitHub voert geplande runs
    # bij drukte vaak later of niet uit; in de praktijk zijn het er minder dan 288 per dag.
    - cron: '2-59/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-huurwoningen
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: node src/index.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit gewijzigde state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "Update seen listings"
          git pull --rebase
          git push
